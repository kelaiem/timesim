# §266 landing two — DOES THE BUILD STILL LET GO OF THE THREAD?
#
# tools/probe-239-boot-yield.mjs, run on every pull request that can change
# what the boot does. §239 made main.js's module evaluation hand the thread
# back at seams; three weeks later main held it for 5 s at a stretch, because
# build code that arrived later arrived without seams and NOTHING RAN THE
# PROBE. §266 landing one restored it (and main moved under it twice more, each
# time arriving without seams). This is the half that stops a fourth time:
# a builder that lands synchronous goes red on its own pull request.
#
# ITS OWN WORKFLOW, not a step in Battery, for two reasons:
#   * the ceilings are a property of the HOST. Battery's host is routed
#     (§200: a self-hosted ARM64 runner on opt-in, ubuntu-latest otherwise), so
#     a step there would be judged against whichever machine took the run. One
#     fixed host means one derivation, written beside each ceiling in the probe.
#   * it answers in minutes. Battery's PR wall is 40-125 min; a missing seam
#     is a thirty-second question.
#
# The CONTROL runs every time. A probe that attached to nothing reports a
# breathing build too, and only the control (BREATHE_MS rewritten to Infinity
# in flight) tells the two apart.
#
# The ceilings were measured, not chosen: two batches of six identical jobs on
# this host (the matrix and a measuring branch trigger, both since removed)
# gave the spread each ceiling in the probe is derived from — see its header
# and docs/BUILT.md §266, landing two.
#
# §267 rides the same job, for the same two reasons: the boot screen's bar is
# held to the clock on this host, and a seam added without its table
# regenerated is a seconds-long question. tools/boot-progress.mjs --check
# (browser-free, so it runs before Chromium is even installed) fails when the
# table no longer describes main.js's seams, and fires its own four mutation
# controls; tools/probe-267-boot-progress.mjs holds the bar against the true
# elapsed fraction, with the raw seam ordinal as the control it must beat and a
# frozen bar as the control its pixel reader must see standing still.
#
# `paths` is a POSITIVE list, unlike Battery's paths-ignore: everything the
# boot executes is index.html, a module under src/ or vendor/, and a list of
# three globs cannot fall behind the module graph the way a list of
# exceptions can. A translation table under src/ runs it needlessly; that
# costs three minutes, never a verdict.
name: Boot yield

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'vendor/**'
      - 'tools/probe-239-boot-yield.mjs'
      - 'tools/boot-progress.mjs'
      - 'tools/probe-267-boot-progress.mjs'
      - 'tools/package-lock.json'
      - '.github/workflows/boot-yield.yml'
  push:
    branches: [main, claude/loading-screen-initial-pe3u3v]   # MEASURING — removed before review
  workflow_dispatch:

concurrency:
  group: boot-yield-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:                       # MEASURING — removed before review
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The boot bar's table describes main.js's seams
        run: node tools/boot-progress.mjs --check

      - name: Install pinned Playwright
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Probe the boot's yield, with both controls
        run: node tools/probe-239-boot-yield.mjs --json boot-yield.json

      - name: Probe the boot bar against the clock, with both controls
        if: success() || failure()
        run: node tools/probe-267-boot-progress.mjs --boots 2 --json boot-progress.json

      - name: Print the numbers     # MEASURING — removed before review
        if: always()
        run: |
          node -e "const r=require('./boot-progress.json'); console.log('BOOTPROGRESS', JSON.stringify({host:r.host, live:r.live.map(x=>({span:Math.round(x.spanMs), mean:+x.dev.mean.toFixed(4), worst:+x.dev.worst.toFixed(4), ahead:+x.dev.ahead.toFixed(4), behind:+x.dev.behind.toFixed(4), behindAt:Math.round(x.dev.behindAt), omean:+x.ordinal.mean.toFixed(4), oworst:+x.ordinal.worst.toFixed(4)})), painted:r.painted&&r.painted.levels, frozen:r.frozen&&r.frozen.levels, fail:r.fail}))" || true
          node -e "const r=require('./boot-yield.json'); console.log('BOOTYIELD', JSON.stringify({held:r.live&&r.live.held, task:r.live&&r.live.maxTask, ack:r.live&&r.live.maxLat, fail:r.fail}))" || true

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-yield-${{ github.run_id }}-${{ matrix.run }}
          path: |
            boot-yield.json
            boot-progress.json
          if-no-files-found: warn
          retention-days: 14
