# Cut a new release (major.minor.patch tag on main, e.g. 0.1.2 -> 0.1.3),
# publish a GitHub Release for it, then deploy the tagged tree to the QA
# server over SFTP and repoint the QA symlink at the new release.
#
# Run from the Actions tab (Run workflow) and pick which part to bump.
# Always tags/deploys the current tip of main, regardless of which branch
# is selected in the dispatch UI.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SFTP_HOST            remote host, e.g. qa.example.com
#   SFTP_PORT            optional, defaults to 22
#   SFTP_USER            remote SFTP username
#   SFTP_SSH_KEY         private key (PEM) authorized for that user on the host
#   SFTP_RELEASES_PATH   remote base dir releases are uploaded into, e.g. /srv/releases
#                        (each release lands in $SFTP_RELEASES_PATH/<version>)
#   SFTP_QA_SYMLINK      remote symlink path the QA environment serves from,
#                        e.g. /srv/qa/current -- repointed at the new release dir

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=${LATEST:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $LATEST -> $VERSION ($BUMP)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Build release payload
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Exactly the tracked files at this tag, minus CI/dev-tool config
          # that has no bearing on the running app.
          mkdir -p "$VERSION"
          git archive --format=tar HEAD -- . ':(exclude).github' ':(exclude).claude' \
            | tar -x -C "$VERSION"

      - name: Configure SSH
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release and repoint QA symlink
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_RELEASES_PATH: ${{ secrets.SFTP_RELEASES_PATH }}
          SFTP_QA_SYMLINK: ${{ secrets.SFTP_QA_SYMLINK }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          PORT="${SFTP_PORT:-22}"
          sftp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -P "$PORT" \
            "$SFTP_USER@$SFTP_HOST" <<SFTP_EOF
          -mkdir $SFTP_RELEASES_PATH
          cd $SFTP_RELEASES_PATH
          put -r $VERSION
          -rm $SFTP_QA_SYMLINK
          symlink $SFTP_RELEASES_PATH/$VERSION $SFTP_QA_SYMLINK
          SFTP_EOF
