# Cut a new release (major.minor.patch tag on main, e.g. 0.1.2 -> 0.1.3),
# publish a GitHub Release for it, then deploy that tagged tree to GitHub Pages.
#
# Run from the Actions tab (Run workflow) and pick which part to bump.
# Always tags/deploys the current tip of main, regardless of which branch
# is selected in the dispatch UI.
#
# One-time setup before the deploy job can succeed:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# No secrets or variables are required — deployment authenticates with the
# workflow's own OIDC token.
#
# NOTE: a Pages site is PUBLIC even when its repository is private, and this
# app has no build step, so the deployed site IS the source. Enabling Pages
# publishes src/, vendor/ and the docs to the open internet. Serving Pages
# from a private repository also requires a paid GitHub plan.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=${LATEST:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $LATEST -> $VERSION ($BUMP)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/configure-pages@v5

      - name: Build site payload
        run: |
          # Exactly the tracked files at this tag, minus CI/dev-tool config
          # that has no bearing on the running app. The app is a no-build
          # static site, so the tree ships as-is; every path in index.html is
          # relative, which is what lets it serve from a /timesim/ subpath.
          mkdir -p _site
          git archive --format=tar HEAD -- . \
            ':(exclude).github' ':(exclude).claude' ':(exclude).githooks' \
            | tar -x -C _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
