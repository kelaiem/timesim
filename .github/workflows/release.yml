# Cut a new release (major.minor.patch tag on main, e.g. 0.1.2 -> 0.1.3),
# publish a GitHub Release for it, then deploy the tagged tree to the QA
# server over SFTP and repoint the QA symlink at the new release.
#
# Run from the Actions tab (Run workflow) and pick which part to bump.
# Always tags/deploys the current tip of main, regardless of which branch
# is selected in the dispatch UI.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   SFTP_HOST            remote host, e.g. qa.example.com
#   SFTP_PORT            optional, defaults to 22
#   SFTP_USER            remote SFTP username
#   SFTP_SSH_KEY         private key (PEM) authorized for that user on the host
#
# Required repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SFTP_PROJECT_PATH    remote project root the SFTP session is chdir'd into before
#                        anything else runs; SFTP_RELEASES_PATH and SFTP_QA_SYMLINK
#                        below are resolved relative to this
#   SFTP_RELEASES_PATH   base dir (relative to SFTP_PROJECT_PATH) releases are
#                        uploaded into -- each release lands in
#                        $SFTP_PROJECT_PATH/$SFTP_RELEASES_PATH/<version>
#   SFTP_QA_SYMLINK      symlink path (relative to SFTP_PROJECT_PATH) the QA
#                        environment serves from -- repointed at the new release dir

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST=${LATEST:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $LATEST -> $VERSION ($BUMP)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  # §88 — hand off to the GitHub Pages environments, so `testing` picks up the
  # release this run just published.
  #
  # A DISPATCH rather than a `release: published` trigger on pages.yml, and the
  # difference is which tooling stamps the site. pages.yml builds each
  # environment's tree from its own ref with `git archive`, but that archive
  # EXCLUDES tools/ — so the stamper comes from the checkout. A release-event
  # trigger checks out the tag, which made "which stamper built production"
  # depend on what woke the workflow, and which older tags cannot satisfy at all
  # (none of them contain tools/build-pages.mjs). Dispatching --ref main pins
  # the workflow file and its tooling to the same place, every time.
  #
  # It needs `actions: write`, and it works with GITHUB_TOKEN because
  # workflow_dispatch is one of the two documented exceptions to "events
  # triggered by GITHUB_TOKEN do not create a workflow run". If it ever stops
  # firing, the symptom is a missing Pages run (not a failed one) and the
  # fallback is running pages.yml by hand from the Actions tab.
  #
  # `needs: release`, NOT `needs: deploy`: the two deploy targets are
  # independent, and a QA SFTP failure should not also withhold the published
  # release from Pages.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish the Pages environments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "::notice::dispatched pages.yml on main — testing will pick up $VERSION"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Build release payload
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # §88 — the payload is tools/payload.sh's, which pages.yml calls too,
          # so QA and the Pages environments serve the same bytes by
          # construction. Read that file for what is cut and why; the short
          # version is "the app, vendor/, and the licences", with repo
          # documentation and dev tooling left in the repository where they
          # belong. tools/ is excluded from the PAYLOAD but still present in
          # the checkout, which is where this and the stamp step run from.
          sh tools/payload.sh HEAD "$VERSION"

          # Asserted, not merely configured — same reasoning as pages.yml. A
          # pathspec breaks silently, and a release that quietly carries the
          # repo's documentation looks exactly like a healthy one.
          leaked=$(find "$VERSION" \( -name '*.md' -o -name 'dev_server.py' \
            -o -name 'test-geometry.html' -o -name '.gitignore' -o -name '.githooks' \) -print)
          if [ -n "$leaked" ]; then
            echo "$leaked"
            echo "::error::files that must not be released are in the payload (see list above)"
            exit 1
          fi
          # The other half: LICENSE and the vendor licences survive the *.md
          # rule only by being extensionless and .txt, which is a coincidence.
          # A release carrying vendored three.js must carry its licences.
          for f in "$VERSION/LICENSE" "$VERSION/vendor/LICENSE-three.txt" \
                   "$VERSION/vendor/LICENSE-three-mesh-bvh.txt"; do
            [ -f "$f" ] || { echo "::error::$f is missing from the release payload"; exit 1; }
          done

      # §28 layer 1 — version every asset URL so a browser cannot serve a
      # stale one, and emit version.json for the running app to poll. URLs
      # stay RELATIVE and carry ?v=<version>: the site is distributed as the
      # QA symlink, and whether the releases directory is itself inside the
      # web root is not knowable from this repo. Rebasing onto an absolute
      # /<releases>/<version>/ path would 404 the whole app if it is not.
      - name: Stamp release URLs and version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd "$VERSION"
          node ../tools/stamp-release.mjs "$VERSION"

      - name: Configure SSH
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_SSH_KEY: ${{ secrets.SFTP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release and repoint QA symlink
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_RELEASES_PATH: ${{ vars.SFTP_RELEASES_PATH }}
          SFTP_PROJECT_PATH: ${{ vars.SFTP_PROJECT_PATH }}
          SFTP_QA_SYMLINK: ${{ vars.SFTP_QA_SYMLINK }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          PORT="${SFTP_PORT:-22}"
          sftp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -P "$PORT" \
            "$SFTP_USER@$SFTP_HOST" <<SFTP_EOF
          cd $SFTP_PROJECT_PATH
          -mkdir $SFTP_RELEASES_PATH
          put -r $VERSION $SFTP_RELEASES_PATH/$VERSION
          -rm $SFTP_QA_SYMLINK
          symlink $SFTP_RELEASES_PATH/$VERSION $SFTP_QA_SYMLINK
          SFTP_EOF
