# §73 tier two — the explainer's translation gate, and the instrument index
# beside it.
#
# Its own workflow rather than a step in Battery, for two reasons: it is
# ~1 min against the battery's ~13, so a prose typo should not wait behind
# the sweeps; and explain.html is sim-code-free by contract, so its gate has
# no business inside the geometry one.
#
# TWO TENANTS, and the rule for joining them. tools/index-instruments.mjs
# --check is the same SHAPE of thing: generated, milliseconds, no browser,
# about a DOCUMENT rather than about the movement. A seventh workflow for a
# millisecond check would cost more attention than it saves. What this must
# not become is a bin — anything added here has to meet all three.
#
# NO § NUMBER on that second tenant, deliberately: §42's own retirement note
# settles it — "work ON THIS REPO is not a movement capability and does not
# take a §". The index is tooling about the repository, exactly like the
# shipped-list checker whose filing raised the question.
#
# What failing means, in order of how it usually happens:
#   * a key stopped matching  — someone edited the English and its
#     translation now falls back to English VISIBLY (the honest failure).
#     Fix: re-translate, regenerating keys with --extract.
#   * markup / <code> / id drift — a translation dropped a tag, changed a
#     quoted constant, or lost an id an interactive plate looks up.
#   * plate numbers — a number in a plate label did not survive translation.
#     The page's whole promise is that its numbers are greppable in src/*.js.
#   * plate fit — a translated label overran its plate or collided with the
#     next one. German runs ~30% longer and SVG text does not wrap; English
#     is the baseline, so only what a translation makes WORSE fails.
#
# The job also runs tools/explain-quotes.mjs, which answers a question older
# than the translations: does the page still quote src/*.js accurately? The
# header promises it does and CLAUDE.md makes the page part of a §'s
# reconciliation; until now nothing checked it. It needs no browser and runs
# in under a second, so it goes first.
#
# Coverage is reported, not gated: an untranslated block renders English and
# says so. A hard 100% gate would push a future contributor toward machine
# filler to make the light green, which is the opposite of the point.
#
# THE INDEX ARM IS SPLIT BY EVENT, and only the index is:
#
#   pull_request -> CHECK. Fail the PR; the author regenerates and pushes.
#   push to main -> FIX.   Regenerate and commit. Nobody is blocked.
#
# It needed splitting because the index's count is a WHOLE-DIRECTORY fact, so
# it can go stale with no branch doing anything wrong: #407 and #408 each added
# a probe and each regenerated correctly against its own base, and the MERGE of
# the two left main reading 195 where the directory held 196. A merge
# regenerates nothing, and no rebase is available after the fact.
#
# Auto-fixing is safe HERE for the same reason the roadmap repo's links.yml
# gives for BACKLOG.md's contents: the file is a pure restatement of what it
# indexes — every summary is the probe's own leading comment, written by its
# author — so regenerating carries no editorial judgement and can introduce no
# claim. The other two checks in this workflow are NOT of that kind and stay
# verify-only: a translation is editorial, and explain-quotes asserts the page
# against src/*.js rather than restating it. Neither may ever be auto-written.
#
# The index CHECK is therefore skipped on push, because the fix job below is
# what answers for main. Without that skip a stale main reds this workflow at
# the same moment the fix job repairs it.

name: Explainer

on:
  pull_request:
    paths:
      - 'explain.html'
      # §95 — explain-quotes.mjs also gates primer.html (zero identifier
      # claims), so the primer changing must re-run it
      - 'primer.html'
      - 'src/explain-i18n*.js'
      # §95 tier two — the primer's tables and the engine both pages share
      - 'src/primer-i18n*.js'
      - 'src/page-i18n.js'
      - 'src/i18n.js'
      - 'tools/explain-i18n.mjs'
      - 'tools/explain-quotes.mjs'
      # the instrument index is generated from every tools/*.mjs header, so any
      # of them changing can stale it
      - 'tools/**.mjs'
      - 'tools/INDEX.md'
      - '.claude/skills/**'
      - '.github/workflows/explain-i18n.yml'
      # the quote audit compares the page against these, so a constant moving
      # here must re-run it — that is the whole point of the check
      - 'src/layout.js'
      - 'src/main.js'
      - 'src/geometry.js'
  push:
    branches: [main]

concurrency:
  group: explain-i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  explain-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      # Cheapest first, and it needs no browser: if the page has drifted from
      # the source, that is worth knowing before spending a Chromium on prose.
      - name: Check the explainer still quotes the source
        run: node tools/explain-quotes.mjs

      - name: Check the explainer's translations
        run: node tools/explain-i18n.mjs --check

      # The instrument index is GENERATED from the probes' own headers, so it
      # rots the moment someone adds a probe and forgets. It rides this
      # workflow rather than the battery because it needs no browser and takes
      # milliseconds — and because an index nobody can trust is worse than no
      # index, which is the state that made it necessary.
      # PR only. On push to main the fix-index job below regenerates instead —
      # see the header: main can go stale without any branch being at fault.
      - name: Check the instrument index is not stale
        if: github.event_name == 'pull_request'
        run: node tools/index-instruments.mjs --check

  # The repair arm. Browser-free and about a generated document, which is the
  # same bar the index check had to meet to ride this workflow at all.
  fix-index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Serialised, and NOT cancel-in-progress: two quick pushes must not race to
    # commit. The workflow-level group above cancels superseded runs, which is
    # right for a check and wrong for a writer.
    concurrency:
      group: explain-i18n-fix-index
      cancel-in-progress: false
    steps:
      # ref: main rather than the triggering SHA, so the commit lands on the
      # branch tip even if main moved while this was queued.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci and no Chromium: index-instruments.mjs reads the tools/
      # directory and nothing else.
      - name: Regenerate the instrument index
        run: node tools/index-instruments.mjs

      # "[skip ci]" keeps this commit from triggering another run. Even without
      # it the loop would terminate — the next run would find nothing to change
      # — but that wastes a run per fix.
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/INDEX.md; then
            echo "Instrument index already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/INDEX.md
          git commit -m "Regenerate tools/INDEX.md [skip ci]"
          # main may have moved since checkout; rebase this one commit on top.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — rebasing onto main and retrying."
            git pull --rebase origin main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
