# §52 — the inspector battery as a merge gate.
#
# Runs tools/ci-battery.mjs (headless Chromium against dev_server.py) on every
# pull request and on main, so a change that breaks support, the graph, a
# penetration budget, a clearance, the stock floor, boot silence or the
# geometry fingerprint's determinism fails BEFORE it merges — standing rule 4
# as CI instead of discipline.
#
# Sized by measurement, per the entry's own order: the full battery took
# ~13 min wall (clearances ~370 s and sweptOverlap ~220 s the long poles,
# boot ~26 s) on a 2025 dev container. CI hardware is slower and SwiftShader
# does the GL, so the job budget was 3× that measurement — 45 min.
#
# 45 → 60 → 45, and the round trip is the point. TODO 27 drilled the chain's
# 211 joints, tripling that mesh, and sweptOverlap went 352 s → ~1400 s;
# ci-battery.mjs raised its PER-CHECK guard to 45 min for exactly that and left
# this one alone. Two 45s is one too many: the job cap includes checkout, npm
# ci and the Chromium install, so it always bites FIRST, and a check that
# genuinely wedges can never reach the guard written to catch it. Measured,
# every run after TODO 27 merged died here — 188 (41.7 min, the last one to
# finish at all), then 189/190/191/193/194 at 45.4–45.6 min, run 191 and 194
# being pushes to MAIN. GitHub reports a job-timeout kill as `cancelled`, which
# is why a gate that had stopped running for a day still read like somebody's
# force-push. 60 restored the ordering and was declared a STAY, not a fix.
#
# §81 CUT THE WALL AND DID NOT EARN THIS NUMBER BACK, so 60 stands. Its two
# reductions are real and verified byte-identical against the pre-change
# report: the scene is welded (every mesh indexed, ~30% of vertices were
# duplicates) and the harness SHARDS the checks across browser contexts by
# their measured cost, so the wall is max(shard) rather than sum(checks). This
# job stopped dying at 45 and now finishes in 22-37 min.
#
# But 45 was tried first and reverted. §81 derived it from a dev container
# where the battery is 26.5 min; the first run on THIS runner took 36.7 min,
# which makes a 45 cap 1.20x over a 37.5 min job — the very ratio that killed
# runs 188-194.
#
# AND THE RUNNER IS NOT EVEN CONSISTENT, which is the part to keep. The next
# run of the same harness on the same tree took 22.3 min: 2459.1 s of check
# time against 4082.8 s, a 1.66x spread between two CI runs. So there is no
# dev-vs-CI ratio to correct for, only a distribution — and a cap has to clear
# its SLOW TAIL, which one run cannot measure. Both of §81's attempts at these
# numbers came from a single green run, and a green run is exactly what makes
# a too-tight cap look justified until it fires on a healthy build.
#
# The reason sharding cannot buy this number is worth keeping too: the wall is
# max(shard), but the cap is set by the slowest single CHECK, and no partition
# subdivides a check. sweptOverlap alone was 2184.6 s (36.4 min) on the slow
# run and is 57% of all check time. Roadmap §82 owns it. When it lands,
# re-derive this cap AND ci-battery.mjs's per-check guard together, from
# SEVERAL CI runs rather than one.
#
# §82 LANDED, AND §127 THEN BROKE THE "no partition subdivides a check" HALF —
# `inspection` is scheduled as one task per axis now, so the floor is the
# largest TASK rather than the largest check. THE NUMBER STILL DOES NOT MOVE,
# and that is a decision, not an oversight: this cap and the per-check guard
# are sized by the SLOW TAIL of this runner, the paragraphs above exist because
# both were once derived from a single green run, and §127 was measured on a
# 4-vCPU dev container. Re-derive both together once several CI runs of the
# split harness exist — the cap has never been the thing to move first.
#
# Playwright is pinned in tools/package.json so the browser build is stable;
# the browser download is cached keyed on that pin. python3 for dev_server.py
# is preinstalled on ubuntu-latest.

# WHAT THIS JOB IS NOT ABOUT, filtered out by path — offline.yml's precedent.
#
# Everything above is about making a 22-37 minute job survive. The other half
# is not running it when it cannot say anything: this triggered on every pull
# request, so a TODO.md typo cost a full battery, and the reasoning it produced
# was "the same 17 gates, again."
#
# THE FILTER IS THE MECHANISM, and it has to be. A PR body cannot reach a job's
# trigger — that text is composed on GitHub after every hook has run, which is
# why purge-session-links.yml exists beside .githooks/commit-msg — so a "safe
# to skip" checkbox would document an intention and save nothing.
# .github/pull_request_template.md therefore records the OUTCOME and sends a
# disagreement here, to a PR against this list.
#
# `paths-ignore` skips only when EVERY changed file matches, so a path nobody
# has classified still runs the job. That is the safe direction and it is the
# reason this list may stay short: it never has to be complete, only true.
#
# TRUE IS NOW MEASURED, NOT ASSERTED (§95 tier two). ci-battery.mjs walks
# index.html's transitive module graph and fails if any file this list ignores
# is ON it — because every claim above is the same claim, "the battery cannot
# see this file," and one wrong entry silently disarms the gate on exactly the
# change that needed it. The near miss that motivated it: `src/*i18n*.js` would
# be the obvious glob for the entries below and it matches `src/i18n.js`, which
# main.js imports — one character's worth of convenience between this list and
# letting tier-one chrome changes skip the battery entirely.
#
# That check lives in the harness rather than beside this file for a reason
# worth keeping: editing this list touches `.github/workflows/**`, which is
# DELIBERATELY ABSENT from it, so a change to the list always runs the battery
# and therefore always runs the check that judges it.
#
# Every entry is an invariant, not a guess about what usually matters:
#
#   **/*.md            the battery boots index.html; no markdown is ever loaded
#   explain.html       "sim-code-free, so explainer landings don't touch the
#                      battery" (CLAUDE.md). explain-i18n.yml is its gate.
#   primer.html        §95 — the same invariant, same gate. Sim-code-free by
#                      contract: its ONE tie to the app was an href in the HUD
#   src/explain-i18n*  that page's tables — imported by explain.html and by
#   src/primer-i18n*   nothing else; index.html loads only src/main.js
#   src/page-i18n.js   §95 tier two's shared engine. It is imported BY the two
#                      pages' i18n modules and imports src/i18n.js in turn —
#                      the arrow points away from the app, so nothing on
#                      index.html's graph reaches it
#   test-geometry.html a separate page. The battery never opens it
#   sw.js              the battery "runs the source tree and so deliberately
#                      has no worker at all" (CLAUDE.md). offline.yml owns it
#   .githooks, .gitignore, LICENSE, vendor/LICENSE-*.txt
#                      repository, not app — none of it reaches the scene
#
# AND WHAT IS DELIBERATELY ABSENT, because four of them look ignorable:
#
#   tools/**                   contains ci-battery.mjs. Changing the harness is
#                              the one change that most needs the harness run
#   .github/workflows/**       editing the gate must run the gate
#   dev_server.py              the battery's own server
#   src/aesthetics.json        the BUILD. AESTHETICS.md beside it is
#                              documentation and is ignored above; the pair
#                              looks symmetric and is not
#   vendor/*.js                three.js itself
#
# ON REQUIRED CHECKS, since this filter is unsafe the moment that changes.
# Battery is not a required status check today. If it becomes one, a filtered
# run never reports and every docs-only PR blocks forever on a status that will
# not arrive — GitHub's answer is a companion job with the SAME name on the
# inverse filter that exits 0. Add that in the same change, or not at all.
#
# THE PUSH TRIGGER IS DELIBERATELY NOT FILTERED, and it is not an oversight.
# main is the only place the MERGED tree is ever tested — a PR job runs the
# merge preview, and two PRs that were each individually battery-irrelevant
# still land as one tree nobody swept. That run is the post-merge net, it costs
# one job per merge rather than one per pushed commit, and a net with a
# cleverness in it is a net with a hole in it.
#
# It also keeps this list SINGLE. YAML anchors would share it between the two
# triggers, but no workflow here uses one and Actions' support for them is not
# worth a gate on: an unsupported alias does not make the battery lenient, it
# makes the file fail to parse, and payload.sh's header already names the
# alternative failure — two pathspec lists someone keeps in step.

# §152 — THE INCREMENTAL PR RUN, AND WHY THERE IS NO NIGHTLY.
#
# A pair sweep's verdict is f(geometry, pose net, check code). A PR whose three
# are provably unchanged since a run that already passed may inherit that run's
# rows for the pairs it did not touch, and measure only the pairs it did. The
# key is a per-unit SHAPE+PLACE digest (inspect.js's unitDigests); the baseline
# is the previous full run's --report; the gates are evaluated on the UNION of
# the two, so the bar is still standing rule 4's whole-movement bar.
#
# THE BASELINE COMES FROM THE PUSH RUN ABOVE, which already exists and was
# already being thrown away. Every merged tree gets a full, unfiltered battery
# on main; this workflow now keeps that run's report and digests in the Actions
# cache under its SHA, and a PR restores its own merge base's entry.
#
# THE ENTRY THAT SCOPED THIS CALLED FOR A MANDATORY NIGHTLY FULL RUN, and
# building it established that this repo does not need one — a deviation
# recorded here rather than quietly taken. The nightly's job was to bound the
# age of a key error to a day. The push trigger already does better: it is
# deliberately unfiltered, it runs the WHOLE battery (it is never incremental —
# a baseline must be a whole verdict, or errors would chain through the cache),
# and it fires per MERGE rather than per day. A scheduled run on main would
# re-test the same tree the push run just cleared; on a day with no merges there
# is by construction nothing for it to catch. What the nightly was insurance
# against, the push run detects within minutes of the merge instead.
#
# So the honest cost line is better than the entry's: the incremental path
# saves on the ~30% of PR runs it is available for and adds no scheduled work
# at all. `workflow_dispatch` with `full: true` is the on-demand whole run,
# for the day someone wants one without waiting for a merge.
#
# EVERY WAY THIS CAN GO WRONG RESOLVES TOWARDS MORE WORK. No cache hit, an
# unreadable file, a moved check-code digest, a union that cannot be justified
# — each one runs (or fails) rather than skipping, and each one says so in the
# log. The failure mode this feature could have is a stale green, so nothing
# about it is allowed to be quiet.
#
# THE ESCAPE HATCH is a `full-battery` label on the PR, or `[full battery]` in
# the PR title. It exists because the first time someone distrusts the key they
# must have something to reach for other than reverting the feature.

name: Battery

on:
  pull_request:
    # `labeled` is §200's: a routing label added to an open PR must start a
    # run, because a re-run reuses the original payload. The job's `if`
    # below keeps every OTHER label from costing a battery.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'explain.html'
      - 'primer.html'
      - 'src/explain-i18n*.js'
      - 'src/primer-i18n*.js'
      - 'src/page-i18n.js'
      - 'test-geometry.html'
      - 'sw.js'
      - '.githooks/**'
      - '.gitignore'
      - 'LICENSE'
      - 'vendor/LICENSE-*.txt'
  push:
    branches: [main]
  # The on-demand whole run. There is no `schedule:` — see the §152 note above
  # for why the unfiltered push trigger already does the job a nightly would.
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore any baseline and run every check (default for this trigger)'
        type: boolean
        default: true
      runner:
        description: '§200 — where to run: the self-hosted host needs vars.BATTERY_RUNS_ON set'
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest

# A force-push mid-run should kill the stale run — the battery is long enough
# that queued duplicates would otherwise stack up behind it.
concurrency:
  group: battery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# §200 — WHERE THIS JOB RUNS IS DECIDED HERE, BY TRUST FIRST AND BY A VARIABLE
# SECOND.
#
# This is a PUBLIC repository, and GitHub's own guidance is that self-hosted
# runners "should almost never be used for public repositories", because a
# pull request from a fork runs its workflow code on the host. That is exactly
# right and it is why the routing below is two-tiered rather than a label swap:
#
#   · A pull request whose head is a FORK runs on `ubuntu-latest`, always. No
#     variable, label or later edit lower in this file can send it anywhere
#     else — the expression tests the head repo before it reads the variable.
#   · A run the repository OWNER did not trigger runs on `ubuntu-latest`
#     too. `github.actor` is the user whose action caused THIS run — on a
#     pull request's `synchronize` that is whoever pushed the commits being
#     tested, not whoever opened the PR — so a collaborator's push to any
#     branch, their merge, or their dispatch stays GitHub-hosted. Compared
#     against `github.repository_owner` rather than a login: no name in the
#     file, and a transfer to an org makes it match nobody, which is the safe
#     side.
#   · THE HOST IS NEVER THE DEFAULT. A run goes there only when the event
#     itself asks: a pull request carrying the `self-hosted-battery` label or
#     `[self-hosted]` in its title (§152's escape-hatch idiom, inverted), or
#     a workflow_dispatch whose `runner` input says so. A push to main never
#     asks, so merges always run GitHub-hosted — which also keeps main's
#     baseline on the platform ordinary PRs inherit from.
#   · And only when `vars.BATTERY_RUNS_ON` is set. It is the AVAILABILITY
#     switch, not the router: unset it and every opt-in lands on
#     `ubuntu-latest` in silence, which is the outage remedy — a queued
#     self-hosted job waits 24 h for a host that is asleep.
#
# The variable is a single runner LABEL (`timesim-battery`, the one the
# runner scripts register), not JSON: a bare word cannot fail to parse, and a
# label that no online runner carries queues rather than runs the wrong host.
# Merging this file changes nothing until the variable is set AND a PR asks.
#
# TWO MECHANICS OF THE OPT-IN. The title marker is the reliable one at
# creation: `gh pr create --label` applies the label a moment after the PR
# opens, so the opening run's payload may not carry it, while `[self-hosted]`
# in the title is in every payload. And a label added LATER needs the
# `labeled` event — a re-run reuses the original payload — so the trigger
# lists it, the job's `if` lets only the two routing labels start a run (any
# other label would otherwise cost a battery), and `cancel-in-progress`
# retires the hosted run the label supersedes.
#
# WHY A REPOSITORY VARIABLE, WHEN THE PAGES RULE IS "EVERY POINTER IS A GIT
# REF". That rule is about CONTENT — which bytes an environment serves must be
# auditable from history. This pointer is about a HOST, and it never touches a
# byte the battery judges: the same harness runs the same gates on the same
# tree. What it changes is operational — a laptop that has closed its lid
# leaves every trusted job queued for up to 24 hours before GitHub cancels it
# (docs: "A job can be in the queue for 24 hours before it is automatically
# cancelled") — and the fix for that has to be a settings flip, not a revert
# through a PR whose own battery would be queued behind the outage. The step
# summary names the runner that took each run, so the pointer is still read
# off the run rather than remembered.
#
# NOTHING HERE IS SECRET-BEARING. The job uses only the read-scoped
# GITHUB_TOKEN and the Actions cache; release.yml (SFTP key) and pages.yml
# (deploy) stay on GitHub-hosted runners and are not routed by this variable.
# docs/RUNNERS.md carries the rest: the approval-policy recommendation, the
# host's own isolation, and how a host's shard count is set on the host.
jobs:
  battery:
    # A `labeled` event runs the job only for the two labels that change what
    # a run is; every other label is skipped, not run.
    if: github.event.action != 'labeled' || contains(fromJSON('["self-hosted-battery","full-battery"]'), github.event.label.name)
    # Read as: (asked for by a same-repo PR) or (asked for by a dispatch),
    # and owner-triggered, and the host is available — else GitHub-hosted.
    runs-on: >-
      ${{ (
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (contains(github.event.pull_request.labels.*.name, 'self-hosted-battery')
      || contains(github.event.pull_request.title, '[self-hosted]')))
      || (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted')
      ) && github.actor == github.repository_owner && vars.BATTERY_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 50   # must stay ABOVE ci-battery.mjs's per-check guard (35; TODO 38's wind axis re-derived both — guard + the ~15 min this pair has always kept above it)
    steps:
      # §200 — the pointer is read off the run, never remembered. Values go
      # through env, not inline: a head repo name is untrusted text.
      - name: Record which runner took this job (§200)
        env:
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          ROUTE_VAR: ${{ vars.BATTERY_RUNS_ON }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          TITLE: ${{ github.event.pull_request.title }}
          DISPATCH_RUNNER: ${{ inputs.runner }}
        run: |
          asked=no
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'self-hosted-battery' && asked="label"
            printf '%s' "$TITLE" | grep -qF '[self-hosted]' && asked="title"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_RUNNER" = self-hosted ]; then asked="dispatch input"
          fi
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then verdict="FORK — pinned to ubuntu-latest"
          elif [ "$ACTOR" != "$OWNER" ]; then verdict="triggered by a non-owner — pinned to ubuntu-latest"
          elif [ "$asked" = no ]; then verdict="host not asked for — ubuntu-latest by default"
          elif [ -z "$ROUTE_VAR" ]; then verdict="host asked for ($asked) but vars.BATTERY_RUNS_ON is unset — ubuntu-latest"
          else verdict="host asked for ($asked) and available — routed to '$ROUTE_VAR'"
          fi
          echo "§200: ran on runner '$RUNNER_NAME' ($RUNNER_OS/$RUNNER_ARCH); $EVENT from $HEAD_REPO by $ACTOR — $verdict" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        working-directory: tools
        run: npm ci --no-audit --no-fund

      # §200 — Playwright keeps its browsers under ~/.cache on Linux and
      # ~/Library/Caches on macOS; both are listed so the step is right on
      # either host. actions/cache saves whichever exists. On a self-hosted
      # host the browser is already on disk (the setup script installs it) and
      # this is a fast no-op either way.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      # --with-deps also apt-installs the shared libraries Chromium needs,
      # which the browser cache above cannot carry — so it runs every time.
      # Linux only (§200): it is apt work, and on macOS it was measured to
      # download a codec the harness never uses and then stall.
      - name: Install Chromium
        working-directory: tools
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # ---- §152: the baseline, and what this run is allowed to skip ---------
      #
      # A PR restores its MERGE BASE's entry — `base.sha` names the commit the
      # PR is judged against, and it is the tree the push run above measured.
      # An exact-key restore only: a near-miss baseline would be a baseline for
      # a different tree, and `restore-keys` exists to serve exactly the
      # near-miss this must never take.
      #
      # §200 — THE KEY CARRIES THE PLATFORM. A baseline's rows are inherited
      # VERBATIM into a PR's report, so they must come from the same browser
      # build on the same architecture; a macOS/arm64 push run must not seed a
      # fork PR's ubuntu run, whether or not the digests would happen to agree.
      # A platform miss resolves the way every §152 uncertainty does — towards
      # a whole run, said so in the summary.
      - name: Restore the base tree's battery baseline
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .battery-baseline
          key: battery-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.base.sha }}

      # The decision, assembled here rather than inside the harness, because a
      # workflow's own triggers are the thing that knows which run this is.
      # Every branch that does NOT go incremental says so in the step summary,
      # so "the battery was fast today" is never something to reverse-engineer.
      - name: Decide the run mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          HIT: ${{ steps.baseline.outputs.cache-hit }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          args=""
          why=""
          if [ "$EVENT" != "pull_request" ]; then
            why="not a pull request — this run IS the baseline, so it is always whole"
          elif [ "$HIT" != "true" ]; then
            why="no cached baseline for the merge base (${{ github.event.pull_request.base.sha }}) on ${{ runner.os }}/${{ runner.arch }} — running everything"
          elif printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'full-battery'; then
            why="the full-battery label is set — running everything"
          elif printf '%s' "$TITLE" | grep -qF '[full battery]'; then
            why="[full battery] in the PR title — running everything"
          else
            args="--baseline .battery-baseline/report.json --digests-base .battery-baseline/digests.json"
            why="incremental if the check-code digest also matches; the harness decides and logs which"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "§152: $why" >> "$GITHUB_STEP_SUMMARY"
          echo "§152: $why"

      - name: Run the battery
        run: |
          mkdir -p .battery-out
          node tools/ci-battery.mjs \
            --report .battery-out/report.json \
            --digests .battery-out/digests.json \
            ${{ steps.mode.outputs.args }}

      # ---- §186 / TODO 111: the analytic case sectors, held over the pose net
      #
      # CASE_SECTORS is a derivation since §186 — three declared, pose-invariant
      # bores, no scan — on the claim that the case has no metal inboard of
      # CASE_R_IN at any pose the movement reaches. Boot holds that claim at ONE
      # pose (the rule-5 reach assert and the build-pose tripwire beside the
      # sectors); this holds it over the same pose net the battery sweeps, and
      # names the MESH on both sides when it fails — which is what tells you
      # which opening is in the wrong place. TODO 111's option 1, with its
      # overlap objection answered in the item's closure: `inspection` and
      # `sweptOverlap` cover the same pairs denser, but neither can state the
      # bearing-coincidence excuses per mesh. ~72 s measured local; an
      # acceptance test, exit non-zero on any unexcused contact.
      - name: Case relief over the pose net (§186 / TODO 111)
        run: node tools/probe-case-relief.mjs

      # ---- §187: the casing path, and the back envelope the glass hugs
      #
      # Two acceptances the pair sweeps structurally cannot give:
      # · probe-187-casing-path — CAN THE MOVEMENT BE CASED. Assembly lives
      #   between poses, so no pose-based gate ever sees a bore the rim
      #   cannot pass — §3's flange blocked §186's rim for a day with every
      #   sweep green. Fast (~40 s), exit 3 on a blocked path.
      # · probe-back-envelope — the §187 glass derives AT BOOT from a
      #   build-pose scan plus DECLARED mover allowances (boot cannot sweep
      #   poses); this sweeps the full net and fails if any bin tops the
      #   declaration, or if the BUILT pane/step/skirt/aperture come within
      #   CLEAR_MARGIN of swept metal. A mover that grows reds CI here, not
      #   the glass.
      - name: Casing path and back envelope (§187)
        run: |
          node tools/probe-187-casing-path.mjs
          node tools/probe-back-envelope.mjs

      # Only a run that measured the WHOLE movement may become a baseline, and
      # only from main: a report carrying `restrictedTo` inherited rows from a
      # previous baseline, and caching it would let one key error chain forward
      # through every PR that ever reads it. The check is on the artifact
      # rather than on the trigger because the artifact is what would be
      # inherited — a trigger is a claim about a run, and this is the run.
      - name: Keep this run as the next baseline
        if: github.event_name == 'push' && success()
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('.battery-out/report.json')).restrictedTo?1:0)"; then
            mkdir -p .battery-baseline
            cp .battery-out/report.json .battery-out/digests.json .battery-baseline/
            ls -l .battery-baseline | sed 's/^/§152 baseline: /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "§152: this report is restricted — refusing to cache it as a baseline" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Cache it under this commit
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: .battery-baseline
          key: battery-baseline-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      # The report is worth having on a red run too — CLAUDE.md makes a
      # --report diff the acceptance for anything that could move a number, and
      # a failed run is exactly when someone wants to read one.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-report-${{ github.run_id }}
          path: .battery-out/
          # REQUIRED because the path is dot-prefixed. upload-artifact@v4
          # defaults include-hidden-files to false, so `.battery-out/` matched
          # nothing and every run since §152 added this step logged
          # "No files were found with the provided path" and uploaded NOTHING
          # — while the step itself stayed green, which is why it survived.
          # The report is the acceptance instrument CLAUDE.md names ("--report
          # diffed against the base is the acceptance, not the PASS/FAIL
          # column"), so this silently withheld the one artifact a reviewer
          # needs on exactly the runs they need it.
          #
          # Not renaming the directory instead: that would touch four path
          # references (the run step's --report and --digests, the baseline
          # copy, this upload) and need a new .gitignore entry, since
          # `.battery-out` is un-ignored today and stays invisible only by
          # being dot-prefixed. §152's `.battery-baseline` is unaffected
          # either way — it travels by actions/cache, which has no
          # hidden-file exclusion, so the incremental baseline was never
          # broken by this.
          include-hidden-files: true
          #
          # AND `if-no-files-found: error`, which is what stops it recurring.
          # The default is `warn`, and a warning inside a PASSING job is
          # invisible — that is the only reason the bug above survived every
          # run since §152. This is the repo's own "a clean report of work
          # that did not happen", one layer out from the battery, so it gets
          # the repo's own answer: an instrument that produced nothing FAILS
          # rather than passes quietly. Nothing on a CI path may legitimately
          # upload zero files — the harness writes the report before this step
          # on every path that reaches it, and `--spec-only`, which writes
          # none, is not a path CI takes.
          if-no-files-found: error
          retention-days: 14
