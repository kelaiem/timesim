# §52 — the inspector battery as a merge gate.
#
# Runs tools/ci-battery.mjs (headless Chromium against dev_server.py) on every
# pull request and on main, so a change that breaks support, the graph, a
# penetration budget, a clearance, the stock floor, boot silence or the
# geometry fingerprint's determinism fails BEFORE it merges — standing rule 4
# as CI instead of discipline.
#
# Sized by measurement, per the entry's own order: the full battery took
# ~13 min wall (clearances ~370 s and sweptOverlap ~220 s the long poles,
# boot ~26 s) on a 2025 dev container. CI hardware is slower and SwiftShader
# does the GL, so the job budget was 3× that measurement — 45 min.
#
# 45 → 60 → 45, and the round trip is the point. TODO 27 drilled the chain's
# 211 joints, tripling that mesh, and sweptOverlap went 352 s → ~1400 s;
# ci-battery.mjs raised its PER-CHECK guard to 45 min for exactly that and left
# this one alone. Two 45s is one too many: the job cap includes checkout, npm
# ci and the Chromium install, so it always bites FIRST, and a check that
# genuinely wedges can never reach the guard written to catch it. Measured,
# every run after TODO 27 merged died here — 188 (41.7 min, the last one to
# finish at all), then 189/190/191/193/194 at 45.4–45.6 min, run 191 and 194
# being pushes to MAIN. GitHub reports a job-timeout kill as `cancelled`, which
# is why a gate that had stopped running for a day still read like somebody's
# force-push. 60 restored the ordering and was declared a STAY, not a fix.
#
# §81 is the fix, so the stay is repaid. Two reductions, both verified
# byte-identical against the pre-change report: the scene is welded (every mesh
# indexed, ~30% of vertices were duplicates) and the harness SHARDS the checks
# across browser contexts by their measured cost, so the wall is max(shard)
# rather than sum(checks). Measured on a 4-vCPU dev container: 3525.6 s
# (58.8 min) → 1588.1 s (26.5 min), and sweptOverlap alone 2075 s → 1573 s.
# That let ci-battery.mjs re-derive its per-check guard to 40 min, which is
# what makes 45 available here again with the ordering intact — check guard
# 40 < job 45, and a job that measures ~19 min of battery plus setup against
# it. The remaining long pole is still sweptOverlap's confirm tier (roadmap
# §82); if that lands, re-derive both numbers from the new measurement rather
# than trimming either one on its own.
#
# Playwright is pinned in tools/package.json so the browser build is stable;
# the browser download is cached keyed on that pin. python3 for dev_server.py
# is preinstalled on ubuntu-latest.

name: Battery

on:
  pull_request:
  push:
    branches: [main]

# A force-push mid-run should kill the stale run — the battery is long enough
# that queued duplicates would otherwise stack up behind it.
concurrency:
  group: battery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # must stay ABOVE ci-battery.mjs's per-check guard (40)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/package-lock.json') }}

      # --with-deps also apt-installs the shared libraries Chromium needs,
      # which the browser cache above cannot carry — so it runs every time.
      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Run the battery
        run: node tools/ci-battery.mjs
