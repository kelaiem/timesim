<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch Sim — Mechanical Clock Simulation</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./favicon.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* §238 — THE BOOT SCREEN, and why it lives in this document rather than in
     a module. Building the movement is ONE synchronous block: main.js cuts
     every part at module-evaluation time, so nothing — not a frame, not a
     paint — happens between the first byte of that module and the finished
     watch. Measured on a SwiftShader software-GL container (CI's path), that
     is a 27.5 s long task and a first-contentful-paint at 31.7 s; on a GPU it
     is a few seconds. Either way the viewer was looking at #0b0d10 for all of it.
     Three properties this screen needs, and a module-built one cannot have:
       · PAINTED BEFORE THE BLOCK — the entry script below yields a frame
         before it imports main.js, so this is on glass whether the module
         arrives from the network or from the §79 worker's cache.
       · STILL MOVING DURING THE BLOCK — every animation here is on transform
         or opacity alone, which Chromium ticks on the compositor thread. The
         main thread is dead for the whole build; the screen is not. That is
         also why `.boot-note` arrives by animation delay rather than by a
         timer: a setTimeout would not fire until the build had finished and
         the note was no longer wanted.
       · UNABLE TO FAIL — no module, no font, no image, no network. If this
         cannot render, nothing could.
     The dark-on-dark palette is the HUD's (#0b0d10 ground, #eaf0f7 ink,
     #8fa6bf muted), so the fade in §238's retire step reveals the scene
     rather than crossing a colour. */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
    background: #0b0d10; color: #eaf0f7;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* The retire: opacity only, and `display` is never touched — a transition
     the compositor can run, on the one frame where the scene's first pixels
     land. main.js removes the element on transitionend. */
  #boot.done { opacity: 0; transition: opacity 0.45s ease; pointer-events: none; }
  #boot .boot-ring {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: #7a3ad8;            /* the chrome's one accent */
    animation: bootSpin 1.1s linear infinite;
  }
  #boot .boot-head { margin: 0; font-size: 15px; letter-spacing: 0.01em; }
  /* The second line is an ADMISSION, so it arrives only once the wait has
     become one: 4 s of delay, then a fade the compositor owns. */
  #boot .boot-note {
    margin: 0; max-width: 34ch; color: #8fa6bf; font-size: 13px;
    opacity: 0; animation: bootNote 0.8s ease 4s both;
  }
  /* §267 — THE BAR. Where the build is, read from a MEASURED share per seam
     (src/boot-progress.js), written by main.js only when it hands the thread
     back. Its fill is scaleX — §238's rule, since a transform is the one
     property the compositor can carry on its own — and the short transition
     between writes runs there too, so it eases through a hand-back without
     the main thread. It fills from the INLINE start: a bar is read in the
     direction the text is, so under `dir="rtl"` it grows from the right. The
     label is aria-hidden because the bar already carries the number for a
     screen reader, and the whole screen is a live region that would otherwise
     read every step aloud. */
  #boot .boot-progress { display: flex; align-items: center; gap: 10px; }
  #boot .boot-bar {
    width: 180px; height: 3px; border-radius: 2px; overflow: hidden;
    background: rgba(255,255,255,0.12);
  }
  #boot .boot-bar-fill {
    width: 100%; height: 100%; background: #7a3ad8;
    transform: scaleX(0); transform-origin: left center;
    transition: transform 0.3s linear;
  }
  :root[dir="rtl"] #boot .boot-bar-fill { transform-origin: right center; }
  #boot .boot-pct {
    margin: 0; min-width: 4.5ch; text-align: end;
    color: #8fa6bf; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  /* The sound opt-in. Static on purpose (§238: nothing here may animate a
     layout property, and a pressed state needs no motion at all). Hidden once
     the build fails — there is nothing left to enable sound for. */
  /* §290 — the two opt-ins share one row and one look; the camera's is the
     same kind of choice (off at every load, only ever turned on by a click). */
  #boot .boot-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  #boot .boot-sound, #boot .boot-selfie {
    margin: 0; padding: 8px 18px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 13px; color: #eaf0f7; background: transparent;
    border: 1px solid rgba(255,255,255,0.28);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  #boot .boot-sound:focus-visible, #boot .boot-selfie:focus-visible { outline: 2px solid #7a3ad8; outline-offset: 2px; }
  #boot .boot-sound[aria-pressed="true"], #boot .boot-selfie[aria-pressed="true"] { background: #7a3ad8; border-color: #7a3ad8; }
  #boot.failed .boot-sound, #boot.failed .boot-selfie { display: none; }
  /* §291 — the appearance preselect: static (§238 — nothing here animates a
     layout property), two columns of label and control, hidden on a failed
     build. Its controls only ever WRITE a choice; the build reads it when it
     reaches the part, so nothing here waits on the build. */
  #boot .boot-prefs {
    display: grid; grid-template-columns: auto auto; gap: 6px 14px; align-items: center;
    margin: 0; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
    font-size: 13px; color: #c9d4e3;
  }
  #boot .boot-prefs-head { grid-column: 1 / -1; margin: 0 0 2px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #9fb6d9; }
  #boot .boot-prefs label { display: contents; }
  #boot .boot-prefs input[type="color"] { width: 44px; height: 24px; padding: 0; border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; background: transparent; justify-self: start; }
  #boot .boot-prefs select { font: inherit; color: #eaf0f7; background: #15181d; border: 1px solid rgba(255,255,255,0.28); border-radius: 4px; padding: 2px 6px; justify-self: start; }
  #boot .boot-prefs input[type="checkbox"] { justify-self: start; }
  #boot.failed .boot-prefs { display: none; }
  /* The other pages, reachable while the movement builds: each is its own
     document, so following one leaves this build behind rather than waiting
     on it. Plain links, static (§238's rule), and they stay on a failed build
     too — a reader with no watch still has the pages. They wrap rather than
     overflow a phone's width. */
  #boot .boot-links {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
    margin: 0; padding: 0; list-style: none; font-size: 13px;
  }
  #boot .boot-links a { color: #9fb6d9; text-decoration: none; border-bottom: 1px solid rgba(159,182,217,0.35); }
  #boot .boot-links a:hover { color: #eaf0f7; border-bottom-color: #eaf0f7; }
  #boot .boot-links a:focus-visible { outline: 2px solid #7a3ad8; outline-offset: 2px; }
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  @keyframes bootNote { from { opacity: 0; } to { opacity: 1; } }
  /* The failure state (the entry script's catch): the ring stops — a spinner
     over a dead build is a claim that work is happening — and the note stops
     waiting for its 4 s, because at that point it carries the diagnosis. */
  #boot.failed .boot-ring { animation: none; border-top-color: rgba(255,255,255,0.12); }
  #boot.failed .boot-note { animation: none; opacity: 1; }
  /* …and the bar goes: a part-filled bar over a dead build is a claim about
     how far it got that nothing is still measuring. */
  #boot.failed .boot-progress { visibility: hidden; }
  /* §72's tier, applied here: a viewer who has asked for less motion gets a
     static ring and the note immediately, because with the spinner stopped
     the note is the only thing left saying the page is alive. */
  @media (prefers-reduced-motion: reduce) {
    #boot .boot-ring { animation: none; }
    #boot .boot-note { animation-delay: 0s; }
    #boot .boot-bar-fill { transition: none; }
  }
</style>
<!-- The import map comes FIRST, before anything that starts a module fetch.
     A modulepreload resolves its target's static imports as it goes, and once
     a module load has begun Chromium ignores any import map parsed after it
     ("An import map is added after module script load was triggered"). With
     the preloads above the map, a warm-cache RELOAD — Reset, a locale change,
     §240's Import JSON — could get main.js's graph moving before the map was
     read and die on the bare specifier "three". Measured on the SwiftShader
     container: 3 of 3 warm reloads failed on one run and 1 of 3 on clean
     main, 0 of 6 after this order; tools/probe-240-import.mjs holds it. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
<!-- §238 — the entry script imports i18n.js first and main.js only after a
     frame has been painted, which would otherwise serialize two fetches that
     used to overlap. These preloads put the module graph on the wire at parse
     time, so the paint barrier costs a frame and not a round trip. -->
<link rel="modulepreload" href="./src/main.js" />
<link rel="modulepreload" href="./vendor/three.module.js" />
</head>
<body>
<div id="app"></div>
<div id="boot" role="status" aria-live="polite">
  <div class="boot-ring" aria-hidden="true"></div>
  <p class="boot-head" id="boot-head">Building the movement</p>
  <div class="boot-progress">
    <div class="boot-bar" role="progressbar" aria-labelledby="boot-head" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot-bar-fill"></div>
    </div>
    <p class="boot-pct" aria-hidden="true"></p>
  </div>
  <p class="boot-note">Every part is cut from code — nothing is loaded from a file.</p>
  <!-- The ONLY way sound starts at boot. Sound is always off at load — a saved
       "on" or a link cannot start it — because audio needs a trusted gesture
       and boot has none; this button is that gesture, on glass for the whole
       wait. State is the attribute (aria-pressed), never the label. -->
  <div class="boot-opts">
    <button type="button" class="boot-sound" id="boot-sound" aria-pressed="false">Enable sound</button>
    <!-- §290: offered at EVERY load and off by default, like sound: nothing
         saves it and no link can turn it on. A click asks for the camera here,
         during the wait, and hands the stream to main.js. -->
    <button type="button" class="boot-selfie" id="boot-selfie" aria-pressed="false">Camera reflection</button>
  </div>
  <!-- §291: preselect the look while the movement builds. Each control is
       applied when the build reaches what it changes; the sapphire dial is cut
       at build, so changing it here saves the choice and offers a reload.
       Only fields the viewer touches are applied. -->
  <div class="boot-prefs" id="boot-prefs">
    <p class="boot-prefs-head">Appearance</p>
    <label><span>Dial colour</span><input type="color" data-pref="dial.face.color"></label>
    <label><span>Case metal</span><select data-pref="materials.caseMetal.alloy"></select></label>
    <label><span>Ruby colour</span><input type="color" data-pref="materials.ruby.color"></label>
    <label><span>Sapphire dial</span><input type="checkbox" data-pref="dial.plate.sapphire"></label>
    <label><span>Case</span><input type="checkbox" data-view="case" checked></label>
    <label><span>Wireframe view</span><input type="checkbox" data-view="wireframe"></label>
    <label><span>Plate X-ray</span><input type="checkbox" data-view="xray" checked></label>
  </div>
  <ul class="boot-links">
    <li><a href="./primer.html">How they work</a></li>
    <li><a href="./explain.html">The explainer</a></li>
    <li><a href="./technic.html?view=lego">See the LEGO Technic build</a></li>
    <!-- §249's sheet is published once, at the site's root, not per environment:
         an absolute link is the one that resolves from every tier and from QA -->
    <li><a href="https://kelaiem.github.io/timesim/review/">Review the translations</a></li>
  </ul>
</div>
<script>
  // §22 — the watch spec, read from the URL BEFORE any module loads. It must
  // be a plain pre-module script: layout.js derives F_BALANCE and the train
  // counts from globalThis.__WATCH_SPEC at import time, and module-graph
  // evaluation starts the moment the module script below is fetched. Only
  // the geometry-tier knobs live here (§22's two, §33's crown azimuth);
  // every other URL param stays in applyDeepLink(), which runs after boot
  // and poses state rather than geometry.
  //
  // §161 — THE TABLE IS THE ROSTER, and it is published. A variant that saves
  // a spec and a link that carries one must cover exactly what boot READS, and
  // main.js used to keep a hand-typed second copy of this list: it had already
  // fallen two keys behind (`alarmbarrelaz` §129, `dialr` §125), so every saved
  // variant silently dropped them. One declaration, the way LOCALES is one —
  // main.js consumes __WATCH_SPEC_KEYS and asserts rather than restating.
  (() => {
    const p = new URLSearchParams(location.search);
    const SPEC_FIELDS = {
      vph: 'vph',
      reserveh: 'reserveHours',
      crownaz: 'crownAzDeg',            // §33 step 1 — stem azimuth, movement-frame degrees
      barrelstep: 'barrelStepDeg',      // §33 step 3 — the train's
      escstep: 'escapeStepDeg',         // arrangement angles are
      balstep: 'balanceStepDeg',        // solveLayout's own inputs
      alarmaz: 'alarmAzDeg',            // §33 — the alarm corner's azimuth, world degrees
      alarmmod: 'alarmModAzDeg',        // §33 — the whole alarm module's azimuth (striking-wheel station), world degrees
      alarmbarrelaz: 'alarmBarrelAzDeg', // §129 — the alarm BARREL's bearing off the striking wheel (module-relative), which ?alarmmod= cannot move
      // §184 — the OTHER TWO LEGS of that same solved triple. θ_b alone was
      // movable, which meant a URL could break a triple by moving a third of
      // it; these complete the set, and main.js's joint bound judges all three.
      alarmgovaz: 'alarmGovAzDeg',      // §184 — the GOVERNOR's bearing off the striking wheel (module-relative)
      alarmanchoraz: 'alarmGovAnchorAzDeg', // §184 — the ANCHOR's bearing off the governor (module-relative)
      stemaz: 'stemAzDeg',              // §33 step 2 — the stem decoupled, world degrees
      d4: 'd4',                         // §94 tier A — centre→fourth distance: the small-seconds station, in movement units
      rsvr: 'rsvr',                     // §94 tier C — the power-reserve station's radius, dial-local, in movement units
      alarmr: 'alarmr',                 // §98 — the alarm corner's radius, in movement units (§76's pin)
      subdialr: 'subdialr',             // §97 — the shared sub-dial well radius, in movement units
      dialr: 'dialr',                   // §125 — the dial's radius, in movement units (null = the movement's own diameter)
      studr: 'studr',                   // §237 — the hairspring stud's radius, in movement units: where the overcoil's terminal lands, and so how far the cock's carrier arm reaches (null = one coil pitch inside the outer coil)
      formrect: { field: 'formRectSpec', parse: String }, // §307 landing 2 — the MEASURED form rectangle, xMin,xMax,yMin,yMax in movement units (tools/form-layout.mjs --dump prints it)
      case: { field: 'caseShape', parse: String }, // §307 — the case's outline: 'rect' cuts plates, dial and case to the form rectangle the arrangement derives (absent = round, as designed)
      // §36 Apply — a committed route, and the bush stations frozen with it.
      // These are the tier's first NON-NUMERIC knobs, which is why the rows
      // below carry a parse: a route is a polyline, not a quantity. Shape is
      // layout.js's business (ROUTE_SPEC validates and refuses); this table's
      // job is only to say the key exists and how to read it off the URL.
      route: { field: 'routeSpec', parse: String },          // x,y,z;x,y,z;… movement units, two decimals
      routebush: { field: 'routeBushSpec', parse: String },  // i,t;… segment index and fraction, frozen at Apply
    };
    const s = {};
    // ABSENCE is every knob's default at this tier — which is what lets the
    // roster double as "only non-default travels" for the share link, with no
    // per-key default to compare against. A knob is a NUMBER unless its row
    // says otherwise: a bare string is the numeric field it feeds, and an
    // object names its field and how to parse it. §36's route keys are the
    // first that are not numbers, and adding them as a second parsed-elsewhere
    // list would rebuild exactly the two-copy drift §161 deleted.
    for (const k in SPEC_FIELDS) {
      if (!p.has(k)) continue;
      const d = SPEC_FIELDS[k];
      if (typeof d === 'string') s[d] = Number(p.get(k));
      else s[d.field] = d.parse(p.get(k));
    }
    globalThis.__WATCH_SPEC_KEYS = Object.freeze(Object.keys(SPEC_FIELDS));
    if (Object.keys(s).length) globalThis.__WATCH_SPEC = s;
  })();
</script>
<script type="module">
  // §238 — THE ENTRY, in two stages, because the boot screen makes two
  // promises the old one-line <script src> could not keep.
  //
  // 1. IT IS IN THE READER'S LANGUAGE. The screen's strings are authored in
  //    English in the markup above, exactly like every other string in this
  //    app, and resolved at the display site by i18n.js's table (§73 tier
  //    one). That import has to happen BEFORE the build blocks the thread —
  //    afterwards there is no frame left to show a translation in. Importing
  //    it here also settles documentElement's lang and dir in the same breath
  //    (i18n.js writes both at import), so an Arabic reader reads an RTL boot
  //    screen for the wait rather than one that flips at the end of it.
  // 2. IT IS ON GLASS BEFORE THE BUILD STARTS. Module evaluation is one
  //    synchronous block, so the LAST paint before it is the one the viewer
  //    watches for the whole wait. The browser happened to paint in time
  //    while main.js came off the network; served from the §79 worker's
  //    cache it need not, and "happened to" is not a guarantee. So: yield
  //    until a frame has actually been committed, THEN import.
  //
  // The rAF pair is the frame ("the callback ran, then the next one, so a
  // paint went out between them"), and the timeout is its escape: a
  // BACKGROUND TAB gets no animation frames at all, and a boot screen is not
  // worth a watch that never builds. 250 ms is two orders of magnitude
  // clear of a 60 Hz frame and invisible against a build measured in
  // seconds. Whichever fires first wins; the loser is a no-op.
  import { t, localizeTree, fmtPct } from './src/i18n.js';
  // Guarded, and the guard is the point: everything below this line is the
  // app, and the app must not fail to start because its loading screen is
  // missing. A markup edit that loses #boot costs the screen, never the watch.
  const boot = document.getElementById('boot');
  if (boot) localizeTree(boot);
  // §267 — the label starts at the locale's own 0%, written here so it is on
  // glass with the rest of the screen; main.js moves it from the first hand-back.
  const pct = boot && boot.querySelector('.boot-pct');
  if (pct) pct.textContent = fmtPct(0);
  // The sound opt-in. This is the one place at boot that holds a TRUSTED
  // gesture, so the AudioContext is made and unlocked HERE, synchronously in
  // the click, and handed to main.js as window.__bootAudio (it adopts rather
  // than creates). Safari is why it is done this thoroughly: it will not
  // start a context from anything but a click/touchend, and its unlock is only
  // reliable once something has actually been started in the gesture — hence
  // the one-sample silent buffer. A `click`, not pointerdown: touch pointerdown
  // is not an activation on iOS, and the build swallows window pointer events
  // anyway while it runs (main.js BUILD_GUARDED_EVENTS) — `click` is not on
  // that list. Registered BEFORE the paint barrier below so the button works
  // from its first frame. main.js hooks __bootSoundApply when it is far enough
  // along to act on the choice; until then the choice is just the flag.
  const soundBtn = boot && boot.querySelector('#boot-sound');
  if (soundBtn) soundBtn.addEventListener('click', () => {
    const on = soundBtn.getAttribute('aria-pressed') !== 'true';
    if (on) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !window.__bootAudio) window.__bootAudio = new AC();
        const ctx = window.__bootAudio;
        if (ctx) {
          const src = ctx.createBufferSource();
          src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
          src.connect(ctx.destination);
          src.start(0);
          if (ctx.state !== 'running') ctx.resume().catch(() => {});
        }
      } catch (e) { /* no Web Audio: the choice below still reads off */ }
    }
    window.__bootSound = on && !!window.__bootAudio;
    soundBtn.setAttribute('aria-pressed', String(window.__bootSound));
    if (typeof window.__bootSoundApply === 'function') window.__bootSoundApply(window.__bootSound);
  });
  // §290 — the camera opt-in, on the sound opt-in's pattern. The click asks for
  // the camera NOW (so the permission prompt arrives during the wait, not after
  // it) and leaves the pending stream as window.__bootSelfieStream; main.js
  // adopts it through __bootSelfieApply once the reflection exists, and until
  // then the choice is just the flag. A refusal clears the flag and the button.
  const selfieBtn = boot && boot.querySelector('#boot-selfie');
  if (selfieBtn) selfieBtn.addEventListener('click', () => {
    const on = selfieBtn.getAttribute('aria-pressed') !== 'true';
    const md = navigator.mediaDevices;
    if (on && md && md.getUserMedia) {
      const p = md.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      window.__bootSelfieStream = p;
      p.catch(() => {
        if (window.__bootSelfieStream !== p) return;
        window.__bootSelfieStream = null; window.__bootSelfie = false;
        selfieBtn.setAttribute('aria-pressed', 'false');
        if (typeof window.__bootSelfieApply === 'function') window.__bootSelfieApply(false);
      });
    } else if (!on && window.__bootSelfieStream) {
      window.__bootSelfieStream.then((s) => s.getTracks().forEach((tr) => tr.stop())).catch(() => {});
      window.__bootSelfieStream = null;
    }
    window.__bootSelfie = on && !!(md && md.getUserMedia);
    selfieBtn.setAttribute('aria-pressed', String(window.__bootSelfie));
    if (typeof window.__bootSelfieApply === 'function') window.__bootSelfieApply(window.__bootSelfie);
  });
  // §291 — the appearance preselect. The controls are prefilled from the very
  // settings object main.js will build from (aesthetics.js merges the file,
  // this browser's tuning and the link), fetched without holding up the
  // import below. A choice is recorded in window.__bootPrefs (finish
  // settings, by key path) or window.__bootView (case, wireframe, x-ray) and handed
  // to main.js's __bootPrefsApply / __bootViewApply once those exist. Until
  // then the record is the choice, as with sound.
  window.__bootPrefs = {};
  window.__bootView = {};
  const prefsEl = boot && boot.querySelector('#boot-prefs');
  if (prefsEl) {
    import('./src/aesthetics.js').then(({ aesthetics }) => {
      const at = (parts) => parts.reduce((o, k) => (o == null ? o : o[k]), aesthetics);
      for (const el of prefsEl.querySelectorAll('[data-pref]')) {
        const parts = el.dataset.pref.split('.');
        const v = at(parts);
        if (el.tagName === 'SELECT') {
          const opts = (at(parts.slice(0, -1)) || {})._options?.[parts[parts.length - 1]] || [];
          for (const o of opts) { const op = document.createElement('option'); op.value = o.value; op.textContent = t(o.label); el.appendChild(op); }
          el.value = v;
        } else if (el.type === 'checkbox') el.checked = !!v;
        else el.value = v;
      }
    }).catch(() => {});
    for (const el of prefsEl.querySelectorAll('[data-pref]')) el.addEventListener('change', () => {
      const v = el.type === 'checkbox' ? el.checked : el.value;
      window.__bootPrefs[el.dataset.pref] = v;
      if (typeof window.__bootPrefsApply === 'function') window.__bootPrefsApply(el.dataset.pref, v);
    });
    for (const el of prefsEl.querySelectorAll('[data-view]')) el.addEventListener('change', () => {
      window.__bootView[el.dataset.view] = el.checked;
      if (typeof window.__bootViewApply === 'function') window.__bootViewApply(el.dataset.view, el.checked);
    });
  }
  await new Promise((resolve) => {
    let settled = false;
    const go = () => { if (!settled) { settled = true; resolve(); } };
    requestAnimationFrame(() => requestAnimationFrame(go));
    setTimeout(go, 250);
  });
  import('./src/main.js').catch((err) => {
    // A build that dies used to leave a black page; with a boot screen over
    // it, it would leave a ring turning forever — a screen claiming work is
    // happening when none is. Say what happened instead, and keep the
    // failure loud for everything downstream: window.__bootError is the
    // surface TODO 30 gave the battery (main.js publishes it for errors it
    // is alive to see; a rejected import is the case it cannot), and the
    // rethrow keeps the uncaught-error path — pageerror, the console —
    // exactly as it was when this was a <script src>.
    if (!window.__bootError) {
      window.__bootError = { message: String((err && err.message) || err), stack: (err && err.stack) || null };
    }
    if (boot) {
      boot.classList.add('failed');
      boot.querySelector('.boot-head').textContent = t('The movement did not build');
      boot.querySelector('.boot-note').textContent = t('The browser console has the error.');
    }
    setTimeout(() => { throw err; });
  });
</script>
</body>
</html>
