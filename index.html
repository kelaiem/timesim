<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch Sim — Mechanical Clock Simulation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script>
  // §22 — the watch spec, read from the URL BEFORE any module loads. It must
  // be a plain pre-module script: layout.js derives F_BALANCE and the train
  // counts from globalThis.__WATCH_SPEC at import time, and module-graph
  // evaluation starts the moment the module script below is fetched. Only
  // the geometry-tier knobs live here (§22's two, §33's crown azimuth);
  // every other URL param stays in applyDeepLink(), which runs after boot
  // and poses state rather than geometry.
  (() => {
    const p = new URLSearchParams(location.search);
    const s = {};
    if (p.has('vph')) s.vph = Number(p.get('vph'));
    if (p.has('reserveh')) s.reserveHours = Number(p.get('reserveh'));
    if (p.has('crownaz')) s.crownAzDeg = Number(p.get('crownaz')); // §33 step 1 — stem azimuth, movement-frame degrees
    if (p.has('barrelstep')) s.barrelStepDeg = Number(p.get('barrelstep'));   // §33 step 3 — the train's
    if (p.has('escstep')) s.escapeStepDeg = Number(p.get('escstep'));         // arrangement angles are
    if (p.has('balstep')) s.balanceStepDeg = Number(p.get('balstep'));        // solveLayout's own inputs
    if (p.has('alarmaz')) s.alarmAzDeg = Number(p.get('alarmaz'));            // §33 — the alarm corner's azimuth, world degrees
    if (p.has('pushaz')) s.pushAzDeg = Number(p.get('pushaz'));                // §33 — the alarm pusher's press axis, world degrees
    if (p.has('stemaz')) s.stemAzDeg = Number(p.get('stemaz'));                // §33 step 2 — the stem decoupled, world degrees
    if (Object.keys(s).length) globalThis.__WATCH_SPEC = s;
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
